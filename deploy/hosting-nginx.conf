# ===========================================================================
#  Tadkhir — nginx + PHP-FPM on a shared host, no Docker.
#
#  Replace `{{server_name}}` with your own host before pasting. Everything else
#  marked {{…}} is filled in by the hosting panel's own template variables.
#
#  This is the same server docker/nginx/default.conf is, with the panel's two
#  extra pieces kept: the first block (80/443 + Varnish) is the panel's edge,
#  and the second block (8080 + PHP-FPM) does exactly what the container's nginx
#  does — the security headers, the cache policy, the refusals, and the one
#  front controller. When the two files disagree, the container is the
#  reference, and tests/build.test.mjs asserts the rules below stay in step.
#
#  FILES TO UPLOAD into {{root}} — nothing else is reachable, and nothing else
#  is needed:
#
#      app/dist/               the built assets + app/dist/index.html (the shell)
#      app/icons/              the PWA icons
#      app/manifest.webmanifest
#      app/sw.js
#      api/                    index.php, config.php, db.php, auth.php, sync.php, gc.php
#      api/var/                EMPTY, writable by the PHP user (the SQLite file)
#
#  `npm ci && npm run build` has to have produced app/dist/ on whatever machine
#  builds. Everything under app/js, app/css, and app/index.html is an INPUT to
#  that build rather than part of the deployment: this config refuses the whole
#  app/ prefix over HTTP, so uploading those files changes nothing except the
#  time it takes.
#
#  REQUIREMENTS: PHP >= 8.0 with pdo_sqlite and mbstring, and api/var/ writable
#  by the PHP-FPM user (mkdir -p api/var && chown <php-user> api/var && chmod
#  700 api/var). DATABASE_PATH defaults to api/var/sync.sqlite and ENVIRONMENT
#  defaults to production, so with nothing configured the session cookie is
#  Secure and the database lands next to the code.
#
#  WHY `rewrite … break` AND NOT `root`/`alias` PER LOCATION: {{root}} expands
#  to a whole `root …;` directive, so the document root's path cannot be
#  written inside another directive — which is what a per-location `root
#  {{root}}/app;` or `alias` would need, because the served URLs are /dist/…
#  while the files are at {{root}}/app/dist/…. Each location that reaches into
#  app/ therefore rewrites the URI to the app-relative path and stops. `break`
#  and not `last`: `break` keeps the request in the current location instead of
#  re-running location matching, which is what keeps the `^~ /app/` refusal
#  below from answering the shell's own internal path. `$document_root` in
#  SCRIPT_FILENAME is the same idea, read from the server's root.
#
#  IF NGINX SAYS "directive is duplicate": a directive that takes one value
#  cannot appear twice in the same context, and `include
#  /etc/nginx/global_settings;` below sits in the same context as the settings
#  here. So a panel that already sets one of them refuses to start:
#
#      nginx: [emerg] "<name>" directive is duplicate in .../<your vhost>:NNN
#
#  The fix is to delete the line NNN names here and let the panel's value stand —
#  it is the panel's own setting for the whole server, and only the first of the
#  two was ever going to apply. That happened once, on
#  fastcgi_buffer_size (whose `include fastcgi_params` already set it), so the
#  candidates are the single-value ones this file states: server_tokens,
#  client_max_body_size, client_body_timeout, client_header_timeout, gzip,
#  gzip_vary, gzip_comp_level, gzip_min_length, gzip_types, and the four
#  set_real_ip_from / real_ip_* lines. `add_header`, `expires`, `location` and
#  `rewrite` may repeat freely and never collide.
#
#  Run `nginx -t` after pasting. It is the only check that can see any of this:
#  every test in the repository reads this file as TEXT, and the front controller
#  and docker-router.php are PHP — they cannot see a directive nginx rejects.
# ===========================================================================


# ---------- front proxy: TLS terminates here ----------
server {
  listen 80;
  listen [::]:80;


  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;


  http2 on;
  http3 off;


  {{ssl_certificate_key}}
  {{ssl_certificate}}

  server_name {{server_name}};

  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}


  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }


  location ~ /.well-known {
    auth_basic off;
    allow all;
  }


  {{settings}}

  # HSTS belongs HERE and nowhere else: this is the only hop that is really
  # TLS, and the block below speaks plain HTTP to a loopback port. A browser
  # caches the header against the host, so sending it from a plain-HTTP response
  # is what makes every later plain-HTTP request to this host fail — the reason
  # it is absent from docker/nginx/default.conf too.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;


  # Everything is proxied to the block below, which is the server that decides
  # what a file is and how long it may be cached. There is deliberately NO
  # extension-based static location in front: one that answers a request from
  # disk at the front instead of asking the app server hands /sw.js to
  # `expires max` — a service worker the browser then stops re-reading, so a
  # release's worker never installs — and hands the request no type at all.
  location / {
    {{varnish_proxy_pass}}


    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;


    proxy_hide_header X-Varnish;
    proxy_redirect off;


    proxy_max_temp_file_size 0;
    proxy_connect_timeout 720;
    proxy_send_timeout 720;
    proxy_read_timeout 720;
  }
}


# ---------- app server: docker/nginx/default.conf's job ----------
server {
  listen 8080;
  listen [::]:8080;


  server_name {{server_name}};


  {{root}}

  include /etc/nginx/global_settings;


  server_tokens off;

  # Must stay in sync with REQUEST_MAX_BYTES in api/config.php (1 MiB) and
  # post_max_size in docker/php/php.ini. The app enforces the real limit; this
  # only caps what nginx forwards.
  client_max_body_size 1m;
  client_body_timeout 15s;
  # A body larger than client_max_body_size is refused before it is buffered,
  # so this bounds the request line and the headers too.
  client_header_timeout 15s;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             application/manifest+json image/svg+xml;

  # The front proxy is the real edge in this deployment, and it appends the
  # client address to X-Forwarded-For. `set_real_ip_from 127.0.0.1` is what
  # makes believing that header safe: only the loopback proxy's word counts,
  # and real_ip_recursive takes the right-most address that is not itself
  # trusted — a client that forges its own X-Forwarded-For can only add
  # entries to the LEFT of the one the proxy appended, and a client that
  # reaches this port directly is not a trusted source, so its header is
  # ignored outright. Without this, every request reaches the app as
  # REMOTE_ADDR 127.0.0.1 and the per-IP failure budget in api/auth.php
  # becomes one budget for the whole internet.
  #
  # X-Forwarded-For, not X-Real-IP: behind Varnish the front proxy's own
  # $remote_addr is the Varnish process on loopback, so X-Real-IP arrives here
  # as 127.0.0.1 while X-Forwarded-For carries the address Varnish saw.
  #
  # DO NOT add `allow 127.0.0.1; deny all;` to this block. The access module
  # judges $remote_addr, which the lines above have already rewritten, so every
  # request would be denied and the site would answer 403 for everything. To
  # take the port off the network, bind it instead: replace the two `listen`
  # lines with `listen 127.0.0.1:8080;` and `listen [::1]:8080;` — but only
  # once the front proxy is confirmed to reach it over loopback, which is what
  # {{varnish_proxy_pass}} expands to.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from ::1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;


  # ---------- Security headers ----------
  # Inherited by every location below, because none of them redefines them.
  # `add_header` in a nested block REPLACES the whole inherited set, so adding
  # one header inside a location later silently drops all of them — which is why
  # every location below uses `expires` and not `add_header`.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
  # script-src/style-src stay 'self' with no unsafe-inline — that is why
  # app/js/ui/dom.js routes the `style` prop through CSSOM instead of the
  # style attribute.
  # `form-action 'none'` would become `form-action 'self'` for one reason: the
  # Web Share Target is a FORM POST. A manifest share target that can carry
  # `files` is `POST` with `multipart/form-data`, so the browser navigates to
  # /api/share/intake by submitting a form, and `form-action 'none'` blocks the
  # one navigation the app's most-used entry point depends on.
  #
  # `img-src` and `media-src` gain `blob:` because every attachment is shown
  # from a Blob URL built in the page — IndexedDB is the only place a captured
  # photograph exists, so without it every thumbnail is an empty box. `media-src`
  # had no declaration and fell back to default-src 'self', which does not
  # include blob: either, so the players are named rather than left to a
  # fallback that never covered them.
  #
  # `camera=(self), microphone=(self)` replaces `camera=(), microphone=()`: the
  # feature that header forbade is the one this release adds, and an empty
  # allowlist is a refusal no page in this origin can lift. Both stay scoped to
  # this origin, so a third-party frame still cannot reach either.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  # HSTS is deliberately NOT sent here: this block is plain HTTP, and the browser
  # caches the header for the whole host, so enabling it on this hop is what
  # would make every later plain-HTTP request fail. The front proxy sends it.


  # ---------- API ----------

  location = /api { return 308 /api/; }

  # Every request under /api/ goes to the ONE front controller, which routes on
  # an exact path match. There is deliberately no `try_files` here: this
  # document root holds api/ itself, so a `try_files $uri` in front of the
  # FastCGI pass would serve /api/var/sync.sqlite straight off disk. Nothing
  # under /api/ is ever served as a file, which is what keeps the database,
  # api/tests/ and the PHP sources unreachable over HTTP.
  location ^~ /api/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
    fastcgi_param SCRIPT_NAME     /api/index.php;
    # TLS terminated at the front proxy, which is why these say https and 443 on
    # a plain-HTTP hop. Nothing in this app reads them — the session cookie is
    # Secure because ENVIRONMENT defaults to production — but the panel's tooling
    # does, and so would any future endpoint that reads $_SERVER['HTTPS'].
    fastcgi_param HTTPS "on";
    fastcgi_param SERVER_PORT 443;
    fastcgi_param HTTP_HOST $host;
    fastcgi_param HTTP_X_FORWARDED_HOST $host;
    fastcgi_param HTTP_X_REAL_IP $remote_addr;
    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    fastcgi_param PHP_VALUE "{{php_settings}}";
    # The front controller's own 4xx and 5xx are JSON and have to reach the
    # client as they are, so `fastcgi_intercept_errors` stays off: turning it on
    # would swap every one of them for an nginx error page and leave the client
    # parsing an HTML body as JSON.
    fastcgi_read_timeout 30s;
    fastcgi_send_timeout 30s;
    # NO fastcgi_buffer_size / fastcgi_buffers HERE, though the container's config
    # states them. `include fastcgi_params` above pulls in this host's own copy of
    # that file, and a panel that already sets either one makes a second, in the
    # same context, a hard startup failure rather than a warning:
    #
    #   nginx: [emerg] "fastcgi_buffer_size" directive is duplicate
    #
    # Measured on the deployment this config was written for: that is the entire startup, and it
    # happens before a single request is served. The panel's values are used
    # instead, which costs a little memory per request and nothing else.
    # No add_header and no expires in this block on purpose: a single add_header
    # here would discard the inherited security-header set above, and an expires
    # would overwrite the `Cache-Control: no-store` that tt_json() sends on
    # every API response.
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
  }


  # ---------- Static frontend assets ----------
  #
  # On the container the whole `app` directory IS the document root, so /dist/
  # and /icons/ sit at the top. Here `app/` sits inside the account's root, and
  # the built shell still names `/dist/…`, so each of these locations rewrites
  # the URL to the file's real path inside app/.

  # CACHE POLICY — the same four rules docker/nginx/default.conf implements, in
  # the same order. Change a rule here and change it there in the same commit.

  # 1. A content-hashed asset is immutable for a year: the name changes whenever
  #    the bytes do, so there is nothing to revalidate. Matched by name rather
  #    than by prefix, so a hand-added /dist/file.js — which has no hash in it
  #    and can therefore change under a stable URL — does not inherit the year.
  #    This regex must stay ABOVE the `location /dist/` fallback, and that
  #    fallback must NOT be `^~`: a `^~` prefix stops nginx evaluating regex
  #    locations at all.
  #
  #    THE QUOTES ARE LOAD-BEARING. nginx's parser reads `{` as the start of a
  #    block even inside a `location ~` pattern, so an unquoted `{8}` ends the
  #    block early and the rest of the pattern is read as a directive:
  #
  #      [emerg] unknown directive "8}\.(?:js|css)$"
  #
  #    and nginx refuses to start at all. Nothing else in the repository can see
  #    that — a text test reads the same line happily, and docker-router.php
  #    implements the same policy in PHP, so it is never nginx's own parser that
  #    looks at it. Do not add a hash quantifier to a pattern without them.
  location ~ "^/dist/[^/]*\.[0-9a-f]{8}\.(?:js|css)$" {
    rewrite ^/dist/(.*)$ /app/dist/$1 break;
    try_files $uri =404;
    expires 1y;
  }

  # 2. Anything else in /dist/ is revalidated, which is the shell: it names the
  #    hashed assets, so a stored copy of it is an app loading an old bundle.
  #    (`expires -1` is what sends `Cache-Control: no-cache`.)
  location = /dist/index.html {
    rewrite ^.*$ /app/dist/index.html break;
    try_files $uri =404;
    expires -1;
  }

  location /dist/ {
    rewrite ^/dist/(.*)$ /app/dist/$1 break;
    try_files $uri =404;
    expires -1;
  }

  # Icons are long-lived: they change only with a release, and they are the one
  # thing a home screen keeps asking for.
  location ^~ /icons/ {
    rewrite ^/icons/(.*)$ /app/icons/$1 break;
    try_files $uri =404;
    expires 30d;
  }

  # The manifest is what installability and the share target are judged against,
  # so it is revalidated on every load — and it needs an explicit type: most
  # hosts' mime.types has no entry for .webmanifest, and served as
  # application/octet-stream it fails the browser's install criteria outright,
  # so the app cannot be installed as a PWA. A `types` block REPLACES the
  # inherited map rather than adding to it, so it is confined to this one
  # location where it can cost nothing else its type.
  location = /manifest.webmanifest {
    rewrite ^.*$ /app/manifest.webmanifest break;
    types {
      application/manifest+json  webmanifest;
    }
    default_type application/octet-stream;
    try_files $uri =404;
    expires -1;
  }

  # A cached service worker is one the browser stops re-reading, so a new
  # release's worker never installs.
  location = /sw.js {
    rewrite ^.*$ /app/sw.js break;
    try_files $uri =404;
    expires -1;
  }


  # ---------- Not served ----------

  # app/ is the built app and, with it, every input to the build: app/index.html
  # (the TEMPLATE, which names no asset and renders an unstyled dead page),
  # app/js/ and app/css/ (readable, unminified source), _headers and _redirects.
  # The built shell references nothing under app/, so the whole prefix is closed.
  # On the container only /js/ and /css/ had to be refused, because there they
  # sit at the top of the document root; here they are one directory below it
  # and so is everything else. The two rules after it are those same refusals
  # under their container-relative names, kept so the file is still right if
  # app/ is ever copied flat into the document root.
  #
  # A request that arrives here is a CLIENT asking for the directory, never the
  # internal rewrite the locations above do: `break` does not re-run location
  # matching, so the shell is not refused by its own path.
  location ^~ /app/ { return 404; }
  location ^~ /js/ { return 404; }
  location ^~ /css/ { return 404; }

  # Nothing in the document root is executed except the one front controller
  # above. /api/ is matched by `^~`, which wins over this regex.
  location ~* \.php$ { return 404; }

  # Platform control files that describe the deployment, and anything that is
  # data rather than a page. Both must never be readable.
  location ~ ^/(_headers|_redirects)$ { return 404; }
  location ~ /\.(?!well-known) { deny all; }
  location ~* \.(?:sqlite|sqlite3|db|db-wal|db-shm|wal|shm|log|bak|old|orig|sql|env|ini|conf|lock|md|json|yaml|yml|map|ts|tsx|jsx|php|py|sh|pl|cgi|phar|htaccess|htpasswd)$ {
    return 404;
  }

  # The ACME challenge, for a panel whose own `location ~ /.well-known` proxies
  # rather than serving it. Without this, a validation request falls into the
  # SPA catch-all and is answered with the app's HTML.
  location ^~ /.well-known/ {
    try_files $uri =404;
  }


  # ---------- SPA ----------
  #
  # The shell is app/dist/index.html, written by the build; app/index.html is
  # the template the build reads. Every route here names the built one, and a
  # 404 means the deployment was never built (`npm ci && npm run build`), which
  # is the one thing an operator needs to be told. `expires -1` is written out
  # on each of them rather than relied upon to be inherited across the internal
  # redirect: measured in the container, `/tasks` and a direct
  # /dist/index.html came back no-cache while `/` and `/index.html` came back
  # with no Cache-Control at all, and the shell's whole policy depends on it.
  location = / {
    rewrite ^.*$ /app/dist/index.html break;
    try_files $uri =404;
    expires -1;
  }

  # The one location that keeps the template from being served under its own
  # name, and where a user typing /index.html lands.
  location = /index.html {
    rewrite ^.*$ /app/dist/index.html break;
    try_files $uri =404;
    expires -1;
  }

  # The catch-all serves ONLY the shell. `$uri` is deliberately not consulted:
  # on the container the document root held nothing but the app, and here it
  # holds the account's other files and api/ as well. An unmatched request is
  # an in-app route, and the shell decides what it means.
  location / {
    rewrite ^.*$ /app/dist/index.html break;
    try_files $uri =404;
    expires -1;
  }
}
