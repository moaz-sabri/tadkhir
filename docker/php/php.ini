; PHP runtime settings for the sync API.
;
; Everything here is a hardening default, not a tuning knob. The app sends
; `Cache-Control: no-store` and `error_reporting(0)` itself; these are the
; container-level guarantees that hold even if a future entry point forgets.

; Do not advertise the interpreter and its version.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
; error_log is deliberately left unset: PHP-FPM already writes to stderr and
; php-fpm.conf sets catch_workers_output = yes, so errors reach `docker logs`
; without a path that might not exist in the image.
error_reporting = E_ALL

; These two matter more than they look. The built-in PHP server has no request
; size cap of its own beyond post_max_size, and REQUEST_MAX_BYTES (1 MiB) is
; checked inside the application AFTER the SAPI has already buffered the body.
; With the default 8M post_max_size, an unauthenticated POST of 8 MiB was read
; into memory before the app's own 1 MiB ceiling was ever consulted. Pinning
; post_max_size to the same value moves the limit down to the SAPI, where it
; costs nothing.
post_max_size = 1M
upload_max_filesize = 1M
; The app never lets PHP handle a file upload; this makes that structural, and
; it stays Off even though one endpoint now receives files (the Web Share Target
; intake, api/share-intake.php). That endpoint reads the raw body from
; php://input and writes the parts itself, into a directory it names, with
; move_uploaded_file never appearing anywhere — so PHP still never creates a
; temp file for a caller's bytes and never decides where one lands.
;
; Reading php://input for a multipart body needs the SAPI to have left the
; stream alone, which is what the next line does. It is not a cost: nothing in
; this app reads $_POST, $_GET or $_FILES, and turning post-data reading off
; REMOVES the double buffering the comment above complains about — the body is
; read once, by the code that wanted it, instead of once by the SAPI and once by
; the application.
;
; If this is missing, everything still works except sharing a FILE from the
; phone: /api/share/intake answers 415 share_intake_unavailable and the app
; falls back to its attachment picker. Nothing is silently lost.
;
; `php -S` (npm run dev, and the single-container install) does not read this
; file, so it takes the same setting on the command line:
;   php -d enable_post_data_reading=0 -S 0.0.0.0:80 -t app docker-router.php
enable_post_data_reading = Off
file_uploads = Off
upload_tmp_dir = /tmp

memory_limit = 64M
max_execution_time = 30
max_input_time = 30
max_input_vars = 1000

; Remote includes are not used and are the classic PHP RCE primitive when a
; caller can influence an include path. Off, not just unused.
allow_url_include = Off
; allow_url_fopen is left ON on purpose: the sync API has no outbound HTTP, but
; turning it off breaks any future legitimate fetch and provides no protection
; on its own.

; Never let an unparsed body become a variable array, and never expose the
; session module's storage to a default path outside the container.
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_secure = 1

opcache.enable = 1
; validate_timestamps stays ON: docker-compose.override.yml bind-mounts ./api into
; the container for development, and switching it off would mean an edited PHP
; file is ignored until the container is recreated. The image itself bakes the
; code in, so this costs nothing in a real deployment.
opcache.validate_timestamps = 1
